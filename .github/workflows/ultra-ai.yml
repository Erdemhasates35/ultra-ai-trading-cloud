        BITGET_API: bg_cd0c64a9a5962c8188c576bb2633a84a
        BITGET_SECRET: 6bf2fa7dc84bf386f2ed2466cbd3eca6a57f89786685d5778a80a19da56892c7
        BITGET_PASS: Arelim3536
      run: |
