name: Ultra AI Trading System — fail-closed execution gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ultra-ai.yml"
      - "ultra_cloud_system.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  ultra-ai-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require reviewed execution source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f ultra_cloud_system.py ]]; then
            echo "::error::Execution disabled: ultra_cloud_system.py is absent from this repository."
            exit 1
          fi
          if [[ ! -f requirements.txt ]]; then
            echo "::error::Execution disabled: requirements.txt is absent; dependencies are not pinned."
            exit 1
          fi

      - name: Require rotated credentials in GitHub Secrets
        shell: bash
        env:
          BINANCE_API: ${{ secrets.BINANCE_API }}
          BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
          BITGET_API: ${{ secrets.BITGET_API }}
          BITGET_SECRET: ${{ secrets.BITGET_SECRET }}
          BITGET_PASS: ${{ secrets.BITGET_PASS }}
        run: |
          set -euo pipefail
          for name in BINANCE_API BINANCE_SECRET BITGET_API BITGET_SECRET BITGET_PASS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Secret: $name"
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned project dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Execute reviewed trading entrypoint
        env:
          BINANCE_API: ${{ secrets.BINANCE_API }}
          BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
          BITGET_API: ${{ secrets.BITGET_API }}
          BITGET_SECRET: ${{ secrets.BITGET_SECRET }}
          BITGET_PASS: ${{ secrets.BITGET_PASS }}
        run: python ultra_cloud_system.py
